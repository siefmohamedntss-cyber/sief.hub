<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عجلة الحظ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: wheel on one side, name entry + slot list + result on the other; stacks to one column on phones. */
  :root {
    --bg: #F5F3F9;
    --fg: #1E1A27;
    --muted: #6A6477;
    --surface: #FFFFFF;
    --line: #DCD7E6;
    --accent: #5B3FB0;
    --accent-fg: #FFFFFF;
    --font-display: "Lalezar", "Readex Pro", "Segoe UI", Tahoma, sans-serif;
    --font-body: "Readex Pro", "Segoe UI", Tahoma, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15121C;
      --fg: #F1EEF7;
      --muted: #A59FB4;
      --surface: #201C2A;
      --line: #393347;
      --accent: #A58BF0;
      --accent-fg: #15121C;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15121C;
    --fg: #F1EEF7;
    --muted: #A59FB4;
    --surface: #201C2A;
    --line: #393347;
    --accent: #A58BF0;
    --accent-fg: #15121C;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    padding-block: 28px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .app { max-width: 1020px; margin-inline: auto; }
  h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2rem, 6vw, 3rem);
    line-height: 1.15;
    margin: 0 0 4px;
    text-wrap: balance;
  }
  .sub { margin: 0 0 28px; color: var(--muted); }

  .grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 420px);
    gap: 32px;
    align-items: start;
  }
  @media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }

  .stage {
    position: relative;
    width: 100%;
    max-width: 480px;
    margin-inline: auto;
    padding-top: 18px;
  }
  .stage canvas { display: block; width: 100%; height: auto; aspect-ratio: 1; }
  .pointer {
    position: absolute;
    top: 2px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 30px solid var(--fg);
    z-index: 2;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.25));
  }

  .panel { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  .label {
    font-size: .8rem;
    letter-spacing: .04em;
    color: var(--muted);
    font-weight: 500;
    margin: 0 0 8px;
  }
  .add { display: flex; gap: 8px; }
  .add input {
    flex: 1 1 auto;
    min-width: 0;
    font: inherit;
    color: var(--fg);
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 11px 14px;
  }
  .add input::placeholder { color: var(--muted); }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 10px;
    border: 1.5px solid transparent;
    padding: 11px 18px;
    font-weight: 600;
  }
  .primary { background: var(--accent); color: var(--accent-fg); }
  .primary:disabled, .spin:disabled { opacity: .45; cursor: not-allowed; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .hint { margin: 8px 0 0; font-size: .875rem; color: var(--muted); min-height: 1.4em; }

  .slots { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .slot {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    min-height: 48px;
  }
  .swatch { flex: 0 0 auto; width: 18px; height: 18px; border-radius: 50%; }
  .slot-name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .slot-name.empty { color: var(--muted); }
  .slot-num { flex: 0 0 auto; font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; }
  .remove {
    background: transparent;
    color: var(--muted);
    border-color: var(--line);
    padding: 4px 10px;
    font-size: .85rem;
    font-weight: 500;
  }
  .remove:hover { color: var(--fg); border-color: var(--muted); }
  .remove[hidden] { display: none !important; }

  .spin {
    width: 100%;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 1.6rem;
    letter-spacing: .02em;
    padding: 12px 18px;
    background: var(--fg);
    color: var(--bg);
  }
  .actions { display: flex; flex-direction: column; gap: 8px; }
  .clear {
    background: transparent;
    color: var(--muted);
    border-color: var(--line);
    font-weight: 500;
    font-size: .9rem;
  }

  .confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  .result {
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    min-height: 104px;
  }
  .result .who {
    font-family: var(--font-display);
    font-size: clamp(1.8rem, 6vw, 2.4rem);
    line-height: 1.2;
    margin: 0;
    overflow-wrap: anywhere;
  }
  .result .who.idle { font-family: var(--font-body); font-size: 1rem; color: var(--muted); }
  .result.pop { border-color: var(--accent); }
  .result.pop .who { animation: pop .5s ease-out; }
  @keyframes pop { from { transform: scale(.85); opacity: .2; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .result.pop .who { animation: none; } }
  body { margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="app" dir="rtl" lang="ar">
  <h1>عجلة الحظ</h1>
  <p class="sub">اكتب الأسماء في الخمس أماكن، وبعدها لف العجلة.</p>

  <div class="grid">
    <div class="stage">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel" role="img" aria-label="عجلة ملونة مقسمة إلى خمسة أجزاء"></canvas>
    </div>

    <div class="panel">
      <form id="addForm" autocomplete="off">
        <p class="label">إضافة اسم</p>
        <div class="add">
          <input id="nameInput" type="text" maxlength="24" placeholder="اكتب اسم هنا" aria-label="اسم جديد">
          <button id="addBtn" class="primary" type="submit">إضافة</button>
        </div>
        <p id="hint" class="hint" aria-live="polite"></p>
      </form>

      <div>
        <p class="label">الأماكن الخمسة</p>
        <ul id="slots" class="slots"></ul>
      </div>

      <div class="actions">
        <button id="spinBtn" class="spin" type="button">لف العجلة</button>
        <button id="soundBtn" class="clear" type="button" aria-pressed="true">الصوت: شغال</button>
        <button id="clearBtn" class="clear" type="button">مسح كل الأسماء</button>
      </div>

      <div id="result" class="result" aria-live="polite">
        <p class="label">النتيجة</p>
        <p id="who" class="who idle">هيظهر الاسم هنا بعد اللف.</p>
      </div>
    </div>
  </div>
</main>
<canvas id="confetti" class="confetti" aria-hidden="true"></canvas>

<script>
(function () {
  var N = 5, TAU = Math.PI * 2, SEG = TAU / N;
  var COLORS = ['#E4572E', '#F2A900', '#17A398', '#6C4AB6', '#2E86DE'];
  var TEXT = ['#FFFFFF', '#2A1F00', '#FFFFFF', '#FFFFFF', '#FFFFFF'];
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var names = ['', '', '', '', ''];
  try {
    var saved = JSON.parse(localStorage.getItem('wheel-names') || 'null');
    if (Array.isArray(saved) && saved.length === N) {
      names = saved.map(function (x) { return typeof x === 'string' ? x : ''; });
    }
  } catch (e) {}
  function persist() { try { localStorage.setItem('wheel-names', JSON.stringify(names)); } catch (e) {} }

  var cv = document.getElementById('wheel');
  var ctx = cv.getContext('2d');
  var slotsEl = document.getElementById('slots');
  var form = document.getElementById('addForm');
  var input = document.getElementById('nameInput');
  var addBtn = document.getElementById('addBtn');
  var hint = document.getElementById('hint');
  var spinBtn = document.getElementById('spinBtn');
  var clearBtn = document.getElementById('clearBtn');
  var resultEl = document.getElementById('result');
  var whoEl = document.getElementById('who');
  var soundBtn = document.getElementById('soundBtn');

  /* Sound: everything is synthesized with Web Audio, no files. */
  var soundOn = true;
  try { if (localStorage.getItem('wheel-sound') === 'off') soundOn = false; } catch (e) {}
  var AC = window.AudioContext || window.webkitAudioContext, actx = null;
  var lastSeg = -1, lastTick = 0;

  function ensureAudio() {
    if (!AC) return;
    try {
      if (!actx) actx = new AC();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
  }
  function tone(freq, start, dur, type, vol) {
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, start);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g);
    g.connect(actx.destination);
    o.start(start);
    o.stop(start + dur + 0.02);
  }
  function playTick() {
    if (!soundOn || !actx) return;
    try {
      var t = actx.currentTime;
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(1150, t);
      o.frequency.exponentialRampToValueAtTime(620, t + 0.04);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
      o.connect(g);
      g.connect(actx.destination);
      o.start(t);
      o.stop(t + 0.08);
    } catch (e) {}
  }
  function playWin() {
    if (!soundOn || !actx) return;
    try {
      var t = actx.currentTime + 0.05;
      [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone(f, t + i * 0.12, 0.35, 'triangle', 0.22); });
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f) { tone(f, t + 0.52, 1.1, 'triangle', 0.12); });
    } catch (e) {}
  }
  function updateSoundBtn() {
    soundBtn.textContent = soundOn ? 'الصوت: شغال' : 'الصوت: مقفول';
    soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
  }

  /* Celebration: confetti from both bottom corners plus a light shower from the top. */
  var cf = document.getElementById('confetti'), cctx = cf.getContext('2d'), cfRaf = 0;
  function burst() {
    if (reduce) return;
    cancelAnimationFrame(cfRaf);
    var d = Math.min(window.devicePixelRatio || 1, 2), W = window.innerWidth, H = window.innerHeight;
    cf.width = Math.round(W * d);
    cf.height = Math.round(H * d);
    cctx.setTransform(d, 0, 0, d, 0, 0);
    var pal = COLORS.concat(['#FFD23F', '#FF6FB5']), parts = [], i;
    var power = Math.max(0.7, Math.min(1.3, H / 800));
    function add(x, y, ang, spd) {
      parts.push({
        x: x, y: y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
        s: 7 + Math.random() * 7, c: pal[Math.floor(Math.random() * pal.length)],
        r: Math.random() * TAU, vr: (Math.random() - 0.5) * 14, round: Math.random() < 0.25
      });
    }
    for (i = 0; i < 90; i++) {
      add(0, H, -Math.PI / 2 + Math.random() * 0.9, (600 + Math.random() * 700) * power);
      add(W, H, -Math.PI / 2 - Math.random() * 0.9, (600 + Math.random() * 700) * power);
    }
    for (i = 0; i < 60; i++) add(Math.random() * W, -20 - Math.random() * 200, Math.PI / 2, 80 + Math.random() * 160);

    var t0 = null, last = 0, DUR = 4.2;
    function step(now) {
      if (t0 === null) { t0 = now; last = now; }
      var dt = Math.min(0.05, (now - last) / 1000), el = (now - t0) / 1000;
      last = now;
      cctx.clearRect(0, 0, W, H);
      var alive = 0, alpha = el > DUR - 1 ? Math.max(0, DUR - el) : 1;
      parts.forEach(function (p) {
        p.vy += 900 * dt;
        p.vx -= p.vx * 0.8 * dt;
        p.vy -= p.vy * 0.5 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.r += p.vr * dt;
        if (p.y > H + 30) return;
        alive++;
        cctx.save();
        cctx.globalAlpha = alpha;
        cctx.translate(p.x, p.y);
        cctx.rotate(p.r);
        cctx.scale(1, Math.cos(p.r * 0.7));
        cctx.fillStyle = p.c;
        if (p.round) { cctx.beginPath(); cctx.arc(0, 0, p.s / 2.4, 0, TAU); cctx.fill(); }
        else cctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
        cctx.restore();
      });
      if (el < DUR && alive > 0) cfRaf = requestAnimationFrame(step);
      else cctx.clearRect(0, 0, W, H);
    }
    cfRaf = requestAnimationFrame(step);
  }

  var rot = -Math.PI / 2 - SEG * 0.5 + 0.25; // starting angle, slot 1 near the top
  var spinning = false;
  var dpr = 1;

  function tok(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function fit(text, maxW) {
    if (ctx.measureText(text).width <= maxW) return text;
    var t = text;
    while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
    return t + '…';
  }

  function draw() {
    var size = cv.width, c = size / 2, r = c - 8 * dpr;
    var surface = tok('--surface'), fg = tok('--fg'), line = tok('--line'), muted = tok('--muted');
    ctx.clearRect(0, 0, size, size);

    for (var i = 0; i < N; i++) {
      var a0 = rot + i * SEG, a1 = a0 + SEG;
      ctx.beginPath();
      ctx.moveTo(c, c);
      ctx.arc(c, c, r, a0, a1);
      ctx.closePath();
      ctx.globalAlpha = 1;
      ctx.fillStyle = surface;
      ctx.fill();
      ctx.globalAlpha = names[i] ? 1 : 0.38;
      ctx.fillStyle = COLORS[i];
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.lineWidth = 3 * dpr;
      ctx.strokeStyle = surface;
      ctx.stroke();

      ctx.save();
      ctx.translate(c, c);
      ctx.rotate(a0 + SEG / 2);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      var px = Math.round(r * 0.105);
      ctx.font = '600 ' + px + 'px "Readex Pro", "Segoe UI", Tahoma, sans-serif';
      var x = r - 16 * dpr, maxW = r * 0.62;
      if (names[i]) {
        ctx.fillStyle = TEXT[i];
        ctx.fillText(fit(names[i], maxW), x, 0);
      } else {
        ctx.fillStyle = fg;
        ctx.globalAlpha = 0.55;
        ctx.fillText(String(i + 1), x, 0);
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(c, c, r, 0, TAU);
    ctx.lineWidth = 5 * dpr;
    ctx.strokeStyle = fg;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(c, c, r * 0.1, 0, TAU);
    ctx.fillStyle = surface;
    ctx.fill();
    ctx.lineWidth = 4 * dpr;
    ctx.strokeStyle = fg;
    ctx.stroke();
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    var w = Math.max(240, Math.round(cv.getBoundingClientRect().width));
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(w * dpr);
    draw();
  }

  function filledCount() { return names.filter(Boolean).length; }

  function renderSlots() {
    slotsEl.innerHTML = '';
    names.forEach(function (n, i) {
      var li = document.createElement('li');
      li.className = 'slot';
      var sw = document.createElement('span');
      sw.className = 'swatch';
      sw.style.background = COLORS[i];
      sw.style.opacity = n ? '1' : '0.4';
      var num = document.createElement('span');
      num.className = 'slot-num';
      num.textContent = String(i + 1);
      var nm = document.createElement('span');
      nm.className = 'slot-name' + (n ? '' : ' empty');
      nm.textContent = n || 'مكان فاضي';
      var rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'remove';
      rm.textContent = 'حذف';
      rm.hidden = !n;
      rm.disabled = spinning;
      rm.setAttribute('aria-label', 'حذف ' + n);
      rm.addEventListener('click', function () {
        if (spinning) return;
        names[i] = '';
        persist(); sync(); draw();
      });
      li.appendChild(sw); li.appendChild(num); li.appendChild(nm); li.appendChild(rm);
      slotsEl.appendChild(li);
    });
  }

  function sync() {
    var full = filledCount() === N;
    renderSlots();
    input.disabled = spinning || full;
    addBtn.disabled = spinning || full;
    spinBtn.disabled = spinning || filledCount() < 2;
    clearBtn.disabled = spinning || filledCount() === 0;
    if (full) hint.textContent = 'الخمس أماكن اتملوا. احذف اسم لو عايز تضيف غيره.';
    else if (filledCount() < 2) hint.textContent = 'أضف اسمين على الأقل عشان تقدر تلف.';
    else hint.textContent = '';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (spinning) return;
    var v = input.value.trim().replace(/\s+/g, ' ');
    if (!v) { hint.textContent = 'اكتب اسم الأول.'; return; }
    var idx = names.indexOf('');
    if (idx < 0) return;
    names[idx] = v;
    input.value = '';
    persist(); sync(); draw();
    if (!input.disabled) input.focus();
  });

  clearBtn.addEventListener('click', function () {
    if (spinning) return;
    names = ['', '', '', '', ''];
    persist(); sync(); draw();
    whoEl.className = 'who idle';
    whoEl.textContent = 'هيظهر الاسم هنا بعد اللف.';
    resultEl.classList.remove('pop');
    input.focus();
  });

  function spin() {
    if (spinning) return;
    var filled = [];
    names.forEach(function (n, i) { if (n) filled.push(i); });
    if (filled.length < 2) return;

    var w = filled[Math.floor(Math.random() * filled.length)];
    var jitter = (Math.random() - 0.5) * SEG * 0.7;
    var target = -Math.PI / 2 - (w + 0.5) * SEG + jitter;
    var cur = ((rot % TAU) + TAU) % TAU;
    var delta = ((((target - cur) % TAU) + TAU) % TAU) + (reduce ? 2 : 5 + Math.floor(Math.random() * 3)) * TAU;
    var from = rot, dur = reduce ? 1200 : 5200, t0 = null;

    spinning = true;
    ensureAudio();
    lastSeg = -1;
    resultEl.classList.remove('pop');
    whoEl.className = 'who idle';
    whoEl.textContent = 'العجلة بتلف...';
    sync();

    function frame(now) {
      if (t0 === null) t0 = now;
      var t = Math.min(1, (now - t0) / dur);
      var e = 1 - Math.pow(1 - t, 4);
      rot = from + delta * e;
      draw();
      var pa = ((((-Math.PI / 2 - rot) % TAU) + TAU) % TAU), ps = Math.floor(pa / SEG);
      if (ps !== lastSeg) {
        if (lastSeg !== -1 && now - lastTick > 30) { playTick(); lastTick = now; }
        lastSeg = ps;
      }
      if (t < 1) { requestAnimationFrame(frame); return; }
      var a = ((((-Math.PI / 2 - rot) % TAU) + TAU) % TAU);
      var idx = Math.min(N - 1, Math.floor(a / SEG));
      spinning = false;
      whoEl.className = 'who';
      whoEl.textContent = names[idx] || names[w];
      void resultEl.offsetWidth;
      resultEl.classList.add('pop');
      sync();
      playWin();
      burst();
    }
    requestAnimationFrame(frame);
  }
  spinBtn.addEventListener('click', spin);
  soundBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    try { localStorage.setItem('wheel-sound', soundOn ? 'on' : 'off'); } catch (e) {}
    updateSoundBtn();
    if (soundOn) { ensureAudio(); playTick(); }
  });
  updateSoundBtn();

  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv); else window.addEventListener('resize', resize);
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', draw);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

  sync();
  resize();
})();
</script>

</body>
</html>
